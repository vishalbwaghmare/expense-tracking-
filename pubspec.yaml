name: expense_tracker
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  get_it: ^8.0.3
  intl: ^0.20.2
  uuid: ^4.5.1
  bloc: ^9.2.1
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  animations: ^2.0.11
  lottie: ^2.7.0
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1
  dartz: ^0.10.1
  go_router: ^17.4.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/expense_traking.png"  

flutter:
  uses-material-design: true

  assets:
    - .env  
    - assets/expense_traking.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

